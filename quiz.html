<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your quiz — paceline.</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');:root{--bg:#080b16;--panel:#111629;--muted:#a4adc4;--white:#f6f7ff;--lime:#c9ff62;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1d3479 0,transparent 48%),var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}.nav{height:74px;max-width:1000px;padding:0 24px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font:700 22px 'Space Grotesk';letter-spacing:-1px;text-decoration:none;color:white}.brand b{color:var(--lime)}.back{color:#c4cbe0;font-size:13px;text-decoration:none}.wrap{max-width:680px;padding:70px 24px 80px;margin:auto}.eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--lime);font-weight:700}.card{margin-top:16px;padding:34px;background:#111629;border:1px solid #ffffff20;border-radius:22px;box-shadow:0 24px 80px #0005}.top{display:flex;justify-content:space-between;color:#9da8c2;font-size:12px}.progress{height:4px;background:#30384d;border-radius:5px;margin:17px 0 37px}.progress span{display:block;height:100%;width:0;background:var(--lime);border-radius:5px;transition:width .3s}h1{font:600 clamp(28px,5vw,39px)/1.15 'Space Grotesk';letter-spacing:-1.4px;margin:0 0 24px}.answers{display:grid;gap:11px}.answer{background:#171e33;color:#e8ebf4;border:1px solid #343d57;border-radius:12px;padding:16px;text-align:left;font:500 15px 'DM Sans';cursor:pointer;transition:.18s}.answer:hover{border-color:#8290ff;background:#202949;transform:translateY(-1px)}.answer.selected{border-color:var(--lime);background:#243027}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:26px;color:#929db7;font-size:12px}.next,.restart{background:var(--lime);color:#111629;border:0;border-radius:30px;padding:13px 22px;font-weight:700;cursor:pointer}.next:disabled{opacity:.4;cursor:not-allowed}.result{line-height:1.65;color:#b6bfd4}.result h1{color:white;margin:14px 0}.traits{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.traits span{border:1px solid #ffffff28;border-radius:20px;padding:8px 12px;color:#e4e8f4;font-size:12px}.bar{height:6px;background:#27304a;border-radius:8px;margin-top:7px}.bar b{display:block;height:100%;background:var(--lime);border-radius:8px}.score{font-size:12px;color:#c4cbe0;margin-top:16px}.score strong{float:right;color:white}@media(max-width:540px){.wrap{padding:45px 16px}.card{padding:23px 18px}.progress{margin-bottom:28px}}
</style></head><body><nav class="nav"><a class="brand" href="index.html">◢ paceline<b>.</b></a><a class="back" href="index.html">← Back to home</a></nav><main class="wrap"><div class="eyebrow">✦ A LITTLE SELF DISCOVERY</div><section class="card" id="quiz"></section></main><script>
const questions=[['Your perfect Saturday looks like…',['A day trip somewhere new','A long lunch with my people','A project I’ve been meaning to start','A quiet day with no plans']],['When plans change, you…',['Feel curious about the new option','Check in with everyone','Make a quick new plan','Take a moment to reset']],['Your friends count on you to…',['Bring a fresh perspective','Make everyone feel included','Get things moving','Listen without judgment']],['Pick a word that feels like you.',['Curious','Thoughtful','Driven','Grounded']]];const profiles=[{name:'The Explorer',desc:'You come alive when there’s something new to discover. Curious and open-minded, you bring fresh energy to every room and love following an interesting idea wherever it leads.',traits:['Curious','Open-minded','Imaginative']},{name:'The Connector',desc:'You have a gift for making people feel seen. Thoughtful and warm, you build the kind of connection that turns a group into a community.',traits:['Thoughtful','Empathetic','Warm']},{name:'The Trailblazer',desc:'You turn ideas into action. Focused and resourceful, you’re happiest when you have a challenge to take on and the freedom to make it your own.',traits:['Driven','Resourceful','Bold']},{name:'The Grounder',desc:'You bring calm and care wherever you go. Steady and observant, you make space for people to be themselves and help everyone feel at home.',traits:['Grounded','Patient','Supportive']}];let step=0,selected=-1,scores=[0,0,0,0];const root=document.getElementById('quiz');function draw(){if(step>=questions.length){result();return}let[q,opts]=questions[step];root.innerHTML=`<div class="top"><span>QUESTION ${step+1} OF ${questions.length}</span><span>${Math.round(step/questions.length*100)}%</span></div><div class="progress"><span style="width:${step/questions.length*100}%"></span></div><h1>${q}</h1><div class="answers">${opts.map((o,i)=>`<button class="answer ${selected===i?'selected':''}" data-i="${i}">${o}<span style="float:right;color:#929db7">↗</span></button>`).join('')}</div><div class="bottom"><span>✦ Go with your gut</span><button class="next" ${selected<0?'disabled':''}>${step===questions.length-1?'See my result':'Next question'} →</button></div>`;root.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;draw()});root.querySelector('.next').onclick=()=>{if(selected<0)return;scores[selected]++;step++;selected=-1;draw()}}function result(){let ix=scores.indexOf(Math.max(...scores)),p=profiles[ix];root.innerHTML=`<div class="top"><span>YOUR PERSONALITY PROFILE</span><span>COMPLETE ✦</span></div><div class="progress"><span style="width:100%"></span></div><div class="eyebrow">YOUR SNAPSHOT</div><h1>${p.name}</h1><p class="result">${p.desc}</p><div class="traits">${p.traits.map(t=>`<span>${t}</span>`).join('')}</div><div class="score">${p.traits[0]}<strong>94%</strong><div class="bar"><b style="width:94%"></b></div></div><div class="score">${p.traits[1]}<strong>82%</strong><div class="bar"><b style="width:82%"></b></div></div><div class="bottom"><a class="back" href="index.html">← Home</a><button class="restart" onclick="step=0;selected=-1;scores=[0,0,0,0];draw()">Take it again ↗</button></div>`}draw();let ctx;function tone(freq){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);let t=ctx.currentTime;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.3,t+.07);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.start(t);o.stop(t+.12)}catch(e){}}document.addEventListener('pointerover',e=>{if(e.target.closest('button'))tone(520)});document.addEventListener('click',e=>{if(e.target.closest('button'))tone(680)});
</script></body></html>
